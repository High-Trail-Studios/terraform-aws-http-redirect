# Regenerate the Inputs/Outputs sections of README.md with:
#   terraform-docs .
formatter: markdown table
version: ">= 0.24.0, < 1.0.0"

sections:
  show:
    - inputs
    - outputs

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  required: true
  type: true
