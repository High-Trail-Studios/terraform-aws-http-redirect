# The "pre-commit"/"pre-push" stage names need pre-commit 3.2 or later.
minimum_pre_commit_version: 3.2.0
fail_fast: true
default_stages:
  - pre-commit
  - pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        files: \.sh$
      - id: check-yaml
      - id: forbid-new-submodules
      - id: detect-private-key
      # Matches the keys in your local AWS config/env, so it catches your own
      # real credentials. Generic secret patterns are gitleaks' job.
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: end-of-file-fixer
        exclude: \.md$
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  # Scans staged changes only. CI skips this hook and scans full history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform-fmt
        entry: ./scripts/terraform-fmt.sh
        language: system
        require_serial: true
