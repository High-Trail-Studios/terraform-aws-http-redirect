name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  function:
    name: function tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node --test tests/function

  terraform:
    name: terraform ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (first with mock providers) and current.
        version: ["1.7.5", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  opentofu:
    name: opentofu ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.8 is the first OpenTofu release with mock providers; 1.8.0 itself
        # fails to convert mocked list values to sets, which 1.8.9 handles.
        version: ["1.8.9", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - run: tofu init -backend=false
      - run: tofu validate
      - run: tofu test

  docs:
    name: README inputs/outputs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install terraform-docs
        env:
          VERSION: v0.24.0
        run: |
          base=https://github.com/terraform-docs/terraform-docs/releases/download/$VERSION
          curl -sSLO "$base/terraform-docs-$VERSION-linux-amd64.tar.gz"
          curl -sSL "$base/terraform-docs-$VERSION.sha256sum" | grep linux-amd64.tar.gz | sha256sum -c
          tar xzf "terraform-docs-$VERSION-linux-amd64.tar.gz" terraform-docs
      - run: ./terraform-docs . --output-check
